<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>06 装修流程时间线</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#172033;background:#edf1f5}.page{min-height:100vh;display:grid;grid-template-columns:55% 45%}.left{padding:58px 64px;background:#f3f6f3}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:20px}.logo{width:42px;height:42px;border-radius:12px;background:#12795f;color:#fff;display:grid;place-items:center}h1{margin:72px 0 18px;font-size:40px;line-height:1.2;font-weight:860}.lead{max-width:500px;color:#667085;font-size:15px;line-height:1.8}.flow{margin-top:38px;display:grid;gap:12px;max-width:500px}.step{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:center}.num{height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid #d9e4d9;color:#12795f;font-weight:850}.step div:last-child{padding:13px 16px;border:1px solid #d9e4d9;background:#fff}.step b{display:block;font-size:14px}.step small{color:#667085;font-size:12px}.login{display:grid;place-items:center;padding:60px;background:#fff}.card{width:390px}.card h2{margin:0;font-size:24px}.card p{margin:8px 0 28px;color:#7a8798;font-size:13px}.field{margin-top:15px}.field label{display:block;margin-bottom:8px;font-size:12px;font-weight:750}.field input{width:100%;height:44px;border:1px solid #d9e1ec;border-radius:8px;padding:0 12px}.row{display:flex;justify-content:space-between;margin:14px 0 22px;font-size:12px;color:#667085}.submit{height:46px;width:100%;border:0;border-radius:8px;background:#12795f;color:#fff;font-weight:850}@media(max-width:900px){.page{grid-template-columns:1fr}.left,.login{padding:36px}.card{width:100%}}
</style></head><body><main class="page"><section class="left"><div class="brand"><span class="logo">急</span>着急信息</div><h1>一条流程，贯穿装修公司的每日工作</h1><p class="lead">从客户第一次咨询，到报价、合同、施工、材料、结算，都可以在系统内连续推进。</p><div class="flow"><div class="step"><span class="num">01</span><div><b>获客跟进</b><small>客户来源、状态、下次跟进</small></div></div><div class="step"><span class="num">02</span><div><b>量房与预算</b><small>空间、定额、主材、综合费用</small></div></div><div class="step"><span class="num">03</span><div><b>合同与施工</b><small>审批、进度、材料订单</small></div></div><div class="step"><span class="num">04</span><div><b>收款与结算</b><small>回款计划、成本、利润</small></div></div></div></section><section class="login"><form class="card"><h2>登录系统</h2><p>进入装修业务管理平台</p><div class="field"><label>手机号 / 账号</label><input value="13800000001"></div><div class="field"><label>密码</label><input type="password" value="123456789"></div><div class="row"><label><input type="checkbox" checked>记住密码</label><span>忘记密码?</span></div><button class="submit">登录</button></form></section></main></body></html>
