<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>01 高端工地实景双栏</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#172033;background:#eef2f6}.page{min-height:100vh;display:grid;grid-template-columns:1.12fr .88fr}.visual{position:relative;overflow:hidden;padding:56px 64px;color:#fff;background:linear-gradient(90deg,rgba(12,24,38,.88),rgba(12,24,38,.48)),url("https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1600&q=85") center/cover}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800}.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.24)}.hero{position:absolute;left:64px;bottom:86px;width:min(540px,70%)}h1{margin:0;font-size:42px;line-height:1.18;letter-spacing:0;font-weight:850}.hero p{margin:20px 0 0;color:rgba(255,255,255,.76);font-size:15px;line-height:1.8}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.chips span{padding:8px 12px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);font-size:12px}.glass{position:absolute;right:58px;bottom:74px;width:260px;padding:16px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.14);backdrop-filter:blur(16px)}.glass b{display:block;font-size:24px}.glass small{color:rgba(255,255,255,.7)}.login{display:grid;place-items:center;padding:60px;background:#f6f8fb}.panel{width:min(390px,100%)}.panel h2{margin:0;font-size:25px;line-height:34px;font-weight:820}.panel>p{margin:8px 0 32px;color:#7a8798;font-size:13px}.field{margin-top:16px}.field label{display:block;margin-bottom:8px;color:#344054;font-size:12px;font-weight:700}.field input{width:100%;height:44px;border:1px solid #d9e1ec;border-radius:8px;background:#fff;padding:0 13px;color:#172033;font-size:13px;outline:none}.field input:focus{border-color:#2f6feb;box-shadow:0 0 0 4px rgba(47,111,235,.12)}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 22px;color:#667085;font-size:12px}.row label{display:flex;gap:7px;align-items:center}.submit{width:100%;height:46px;border:0;border-radius:8px;background:#1f5fe0;color:white;font-size:14px;font-weight:800;box-shadow:0 14px 30px rgba(31,95,224,.24)}@media(max-width:900px){.page{grid-template-columns:1fr}.visual{min-height:440px}.login{padding:36px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="visual">
      <div class="brand"><span class="logo">⌂</span>着急信息</div>
      <div class="hero">
        <h1>让每个工地，都有清晰的管理秩序</h1>
        <p>把客户、报价、材料、施工和结算放进同一个工作入口，装修公司每天打开就能处理真实业务。</p>
        <div class="chips"><span>客户跟进</span><span>预算报价</span><span>材料订单</span><span>工地交付</span></div>
      </div>
      <div class="glass"><small>本月签单额</small><b>¥ 1,268,000</b><small>来自 12 个在谈客户</small></div>
    </section>
    <section class="login"><form class="panel"><h2>欢迎回来</h2><p>登录您的装修管家管理平台</p><div class="field"><label>手机号 / 账号</label><input value="13800000001"></div><div class="field"><label>密码</label><input type="password" value="123456789"></div><div class="row"><label><input type="checkbox" checked>记住密码</label><span>忘记密码?</span></div><button class="submit">登录</button></form></section>
  </main>
</body>
</html>
