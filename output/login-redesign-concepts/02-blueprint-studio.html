<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>02 设计图纸质感</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#e9eef5;color:#142033}.page{min-height:100vh;display:grid;grid-template-columns:58% 42%;background:#eef3f8}.plan{position:relative;padding:54px 62px;background:repeating-linear-gradient(90deg,rgba(44,98,156,.12) 0 1px,transparent 1px 34px),repeating-linear-gradient(0deg,rgba(44,98,156,.12) 0 1px,transparent 1px 34px),#e8f0f7;overflow:hidden}.plan:after{content:"";position:absolute;inset:82px 90px;border:2px solid rgba(31,95,140,.3);box-shadow:inset 180px 0 0 rgba(255,255,255,.24),inset 0 160px 0 rgba(255,255,255,.18)}.brand,.topline{position:relative;z-index:1}.brand{display:flex;gap:12px;align-items:center;font-weight:850;font-size:19px}.logo{width:42px;height:42px;border-radius:10px;background:#fff;color:#2f6feb;display:grid;place-items:center;border:1px solid #c8d8ee}.copy{position:relative;z-index:1;margin-top:110px;max-width:520px}.eyebrow{font-size:12px;font-weight:800;color:#2f6feb;letter-spacing:.12em}h1{margin:18px 0 0;font-size:41px;line-height:1.18;font-weight:860}.copy p{margin:18px 0 0;color:#536174;font-size:15px;line-height:1.8}.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px;max-width:510px}.legend div{border:1px solid #cfdcec;background:rgba(255,255,255,.68);padding:12px}.legend b{display:block;font-size:18px}.legend small{color:#667085}.login{display:grid;place-items:center;padding:56px;background:#f8fafc}.card{width:392px;padding:34px;border:1px solid #dce4ee;background:#fff;box-shadow:0 24px 60px rgba(43,58,80,.08)}h2{margin:0;font-size:24px}.desc{margin:8px 0 28px;color:#7a8798;font-size:13px}.field{margin-top:15px}.field label{display:block;margin-bottom:8px;font-size:12px;font-weight:750;color:#344054}.field input{width:100%;height:44px;border:1px solid #d9e1ec;border-radius:6px;padding:0 12px;font-size:13px}.bar{display:flex;justify-content:space-between;margin:14px 0 22px;font-size:12px;color:#667085}.submit{height:45px;width:100%;border:0;border-radius:6px;background:#173f7a;color:#fff;font-weight:800}@media(max-width:900px){.page{grid-template-columns:1fr}.plan{min-height:440px}.login{padding:32px}.card{width:100%}}
  </style>
</head>
<body><main class="page"><section class="plan"><div class="brand"><span class="logo">⌁</span>着急信息</div><div class="copy"><span class="eyebrow">PROJECT CONTROL SYSTEM</span><h1>像看图纸一样，看清装修公司的每一步</h1><p>预算、定额、材料、工地和财务都按结构化方式管理，减少错漏和重复沟通。</p><div class="legend"><div><small>今日报价</small><b>16</b></div><div><small>待复核</small><b>8</b></div><div><small>施工中</small><b>26</b></div></div></div></section><section class="login"><form class="card"><h2>登录系统</h2><p class="desc">进入装修业务管理后台</p><div class="field"><label>手机号 / 账号</label><input value="13800000001"></div><div class="field"><label>密码</label><input type="password" value="123456789"></div><div class="bar"><label><input type="checkbox" checked> 记住密码</label><span>忘记密码?</span></div><button class="submit">登录</button></form></section></main></body></html>
