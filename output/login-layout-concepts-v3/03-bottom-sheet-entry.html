<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 底部工作台抽屉</title><link rel="stylesheet" href="shared.css"><style>
.scene{background-image:linear-gradient(180deg,rgba(15,12,9,.15),rgba(15,12,9,.78)),url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2200&q=85")}
.headline{position:absolute;left:7vw;top:9vh;color:#fff}.headline h2{font-size:80px;line-height:.92;margin:14px 0;font-family:Georgia,serif;font-weight:500}
.sheet{position:absolute;left:3vw;right:3vw;bottom:3vh;border-radius:34px;background:rgba(255,252,246,.96);border:1px solid rgba(255,255,255,.5);box-shadow:0 -22px 80px rgba(0,0,0,.22);padding:22px;display:grid;grid-template-columns:1fr 390px;gap:28px;align-items:center}
.sheet-info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.info-card{border-radius:20px;background:#f2eadf;padding:20px}.info-card b{display:block;font-size:22px;margin-bottom:6px}
.login-card{box-shadow:none;padding:24px;background:#fff}
@media(max-width:760px){.headline{position:relative;left:auto;top:auto;padding:36px 20px}.headline h2{font-size:44px}.sheet{position:relative;left:auto;right:auto;bottom:auto;margin:18px;grid-template-columns:1fr}.sheet-info{grid-template-columns:1fr}.login-card{width:100%}}
</style></head><body><main class="page scene photo noise"><div class="headline reveal"><div class="brand"><b class="mark">急</b>着急信息</div><h2>开工前，先把数据归位。</h2></div><section class="sheet reveal"><div class="sheet-info"><div class="info-card"><b>报价</b><p>模板、定额、优惠同步计算</p></div><div class="info-card"><b>材料</b><p>主材与辅材订单统一追踪</p></div><div class="info-card"><b>现场</b><p>工程量复核与跟进提醒</p></div></div><div class="login-card"><div class="eyebrow">Bottom Command</div><h1>欢迎回来</h1><p>登录您的装修管家管理平台</p><form class="form"><div class="input-wrap"><input placeholder="手机号 / 账号"></div><div class="input-wrap"><input type="password" placeholder="密码"></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>登录</span><span>→</span></button></form></div></section></main></body></html>
