<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 蓝图画布登录</title><link rel="stylesheet" href="shared.css"><style>
.page{background:#12203a;color:#eaf1f8;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:34px 34px}
.plan{position:absolute;inset:8vh 7vw;border:1px solid rgba(232,241,248,.2)}
.room{position:absolute;border:1px solid rgba(232,241,248,.35);color:rgba(232,241,248,.55);font-size:12px;padding:10px}.r1{left:5%;top:9%;width:28%;height:24%}.r2{left:33%;top:9%;width:22%;height:38%}.r3{left:55%;top:9%;width:31%;height:24%}.r4{left:10%;top:55%;width:40%;height:30%}.r5{left:50%;top:47%;width:36%;height:38%}
.draft-card{position:absolute;left:50%;top:50%;width:430px;transform:translate(-50%,-50%) translate(calc(var(--mx)*10px),calc(var(--my)*8px))}
.dark .eyebrow{color:#7bd6aa}
.submit{background:#e9f1f7;color:#13203a}
@media(max-width:760px){.plan{inset:14px}.draft-card{position:relative;left:auto;top:auto;transform:none;width:auto;margin:28vh 18px 24px}.room{font-size:10px}}
</style></head><body><main class="page noise"><div class="plan"><div class="room r1">客厅 / Living</div><div class="room r2">厨房 / Kitchen</div><div class="room r3">主卧 / Bedroom</div><div class="room r4">预算流线</div><div class="room r5">材料清单</div></div><section class="login-card dark draft-card reveal"><div class="brand"><b class="mark">急</b>着急信息</div><div class="eyebrow" style="margin-top:26px">Blueprint Access</div><h1>欢迎回来</h1><p>蓝图画布适合突出“空间、类别、工程量”的业务属性。</p><form class="form"><div class="field"><label>手机号 / 账号</label><div class="input-wrap"><input placeholder="请输入账号"></div></div><div class="field"><label>密码</label><div class="input-wrap"><input type="password" placeholder="请输入密码"></div></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>登录</span><span>→</span></button></form></section></main><script src="shared.js"></script></body></html>
