<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 杂志封面登录</title><link rel="stylesheet" href="shared.css"><style>
.page{background:#e7ded0;padding:38px;display:grid;grid-template-columns:1fr 360px;gap:24px}
.cover{position:relative;border-radius:36px;overflow:hidden;background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62)),url("https://images.unsplash.com/photo-1600210492493-0946911123ea?auto=format&fit=crop&w=1800&q=85");background-size:cover;background-position:center;min-height:calc(100vh - 76px);padding:38px;color:white}
.masthead{font-family:Georgia,serif;font-size:13vw;line-height:.8;letter-spacing:-.04em}.caption{position:absolute;left:42px;bottom:42px;width:420px}
.login-strip{display:flex;align-items:end}.login-card{width:100%;border-radius:28px}
.issue{position:absolute;right:36px;top:36px;border:1px solid rgba(255,255,255,.35);padding:10px 14px;border-radius:999px}
@media(max-width:900px){.page{display:block;padding:16px}.cover{min-height:50vh}.masthead{font-size:23vw}.caption{position:static;margin-top:22vh;width:auto}.login-strip{display:block;margin-top:16px}}
</style></head><body><main class="page noise"><section class="cover reveal"><div class="brand"><b class="mark">急</b>着急信息</div><div class="issue">2026 装修业务系统</div><div class="masthead">HOME<br>OPS</div><div class="caption"><h1 style="color:white">从第一通跟进，到最后一张报价单。</h1><p style="color:rgba(255,255,255,.76)">杂志封面式登录，更适合做品牌第一印象。</p></div></section><aside class="login-strip"><section class="login-card reveal"><div class="eyebrow">Member Login</div><h1>欢迎回来</h1><p>登录您的装修管家管理平台</p><form class="form"><div class="input-wrap"><input placeholder="手机号 / 账号"></div><div class="input-wrap"><input type="password" placeholder="密码"></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>登录</span><span>→</span></button></form></section></aside></main></body></html>
