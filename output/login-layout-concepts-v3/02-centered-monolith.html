<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 中央建筑碑体</title><link rel="stylesheet" href="shared.css"><style>
.page{display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#ffffff 0,#eee2d1 34%,#cabba4 100%)}
.back-title{position:absolute;inset:auto 0 52%;text-align:center;font-family:Georgia,serif;font-size:16vw;color:rgba(84,63,39,.08);line-height:.8;white-space:nowrap}
.monolith{width:430px;min-height:620px;border-radius:42px;padding:10px;background:rgba(255,255,255,.38);border:1px solid rgba(70,55,38,.12);box-shadow:0 42px 100px rgba(76,57,34,.2);transform:translate(calc(var(--mx)*8px),calc(var(--my)*8px))}
.core{height:100%;border-radius:34px;background:#fbf7f0;padding:44px 36px;display:flex;flex-direction:column;justify-content:center}
.topline{position:absolute;top:5vh;left:50%;transform:translateX(-50%);display:flex;gap:18px;font-size:12px;color:#6f665b}

</style></head><body><main class="page noise"><div class="back-title">DESIGN</div><div class="topline"><span>预算体系</span><span>材料管理</span><span>工程复核</span></div><section class="monolith reveal"><div class="core"><div class="brand"><b class="mark">急</b>着急信息</div><div class="eyebrow" style="margin-top:40px">Secure Access</div><h1>欢迎回来</h1><p>把报价、主材、施工和客户记录放回同一个工作秩序。</p><form class="form"><div class="field"><label>手机号 / 账号</label><div class="input-wrap"><input placeholder="请输入账号"></div></div><div class="field"><label>密码</label><div class="input-wrap"><input type="password" placeholder="请输入密码"></div></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>进入系统</span><span>→</span></button></form></div></section></main><script src="shared.js"></script></body></html>
