<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>08 仪表盘浮动登录坞</title><link rel="stylesheet" href="shared.css"><style>
.page{background:#eef1ef;padding:28px}.dash{height:100%;border-radius:32px;background:#f9faf7;border:1px solid rgba(20,18,14,.1);padding:22px;display:grid;grid-template-columns:220px 1fr 280px;gap:16px;filter:saturate(.82)}
.pane{border-radius:22px;background:#fff;border:1px solid rgba(25,22,18,.08);padding:18px}.navline{height:34px;border-radius:12px;background:#ede8df;margin:12px 0}.chart{height:220px;border-radius:20px;background:linear-gradient(135deg,#dfe9df,#f3eadc)}.rows div{height:38px;border-bottom:1px solid #eee8df}
.dock{position:absolute;left:50%;top:50%;width:440px;transform:translate(-50%,-50%);box-shadow:0 40px 110px rgba(36,30,24,.28)}
.login-card{background:rgba(255,252,247,.98)}
@media(max-width:760px){.page{padding:14px}.dash{grid-template-columns:1fr;opacity:.45}.dock{position:relative;left:auto;top:auto;transform:none;width:auto;margin:-62vh 18px 24px}}
</style></head><body><main class="page noise"><section class="dash"><aside class="pane"><div class="brand"><b class="mark">急</b>着急信息</div><div class="navline"></div><div class="navline"></div><div class="navline"></div></aside><section class="pane"><h2>预算工作台</h2><div class="chart"></div><div class="rows"><div></div><div></div><div></div><div></div></div></section><aside class="pane"><h3>今日提醒</h3><div class="rows"><div></div><div></div><div></div><div></div><div></div></div></aside></section><section class="login-card dock reveal"><div class="eyebrow">Command Dock</div><h1>欢迎回来</h1><p>系统后台质感更强，登录像浮在工作台上的指令坞。</p><form class="form"><div class="input-wrap"><input placeholder="手机号 / 账号"></div><div class="input-wrap"><input type="password" placeholder="密码"></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>进入工作台</span><span>→</span></button></form></section></main></body></html>
