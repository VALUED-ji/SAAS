<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 斜切建筑面板</title><link rel="stylesheet" href="shared.css"><style>
.page{background:#171411;color:#fff}
.diagonal{position:absolute;inset:-8vh 38vw -8vh -8vw;clip-path:polygon(0 0,100% 0,78% 100%,0 100%);background-image:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.1)),url("https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=1800&q=85");background-size:cover;background-position:center;transform:translate(calc(var(--mx)*12px),0)}
.diagonal::after{content:"";position:absolute;inset:0;border-right:1px solid rgba(255,255,255,.25)}
.panel{position:absolute;right:8vw;top:50%;width:410px;transform:translateY(-50%)}
.ribbon{position:absolute;left:6vw;bottom:8vh;font-size:13px;letter-spacing:.18em;color:rgba(255,255,255,.72)}
@media(max-width:760px){.diagonal{inset:0 0 44%;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}.panel{position:relative;right:auto;top:auto;transform:none;width:auto;margin:44vh 18px 24px}.ribbon{display:none}}
</style></head><body><main class="page noise"><div class="diagonal"></div><div class="ribbon">PROJECT / QUOTATION / SUPPLY</div><section class="login-card dark panel reveal"><div class="brand"><b class="mark">急</b>着急信息</div><div class="eyebrow" style="margin-top:30px">Diagonal Studio</div><h1>欢迎回来</h1><p>适合更有品牌调性的装修公司入口，视觉冲击强但登录区足够清晰。</p><form class="form"><div class="field"><label>手机号 / 账号</label><div class="input-wrap"><input placeholder="请输入账号"></div></div><div class="field"><label>密码</label><div class="input-wrap"><input type="password" placeholder="请输入密码"></div></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button" style="background:#b88746"><span>登录</span><span>→</span></button></form></section></main><script src="shared.js"></script></body></html>
