</style></head><body><main class="shell"><aside class="nav"><div class="brand">着急信息 · 登录页 V3</div><div class="note">这批按“结构差异”重做：不再是 10 个左右分栏换皮。每个按钮都是完整 HTML 效果页，确认后再落到正式登录代码。</div><button class="item active" data-file="01-full-bleed-island.html"><b>01 全景海报浮岛</b><span>整屏空间图 + 浮动登录岛</span></button><button class="item" data-file="02-centered-monolith.html"><b>02 中央建筑碑体</b><span>居中垂直碑体，不做左右分区</span></button><button class="item" data-file="03-bottom-sheet-entry.html"><b>03 底部工作台抽屉</b><span>登录区沉到底部，像指令台</span></button><button class="item" data-file="04-diagonal-panel.html"><b>04 斜切建筑面板</b><span>斜切构图，强品牌视觉</span></button><button class="item" data-file="05-magazine-cover.html"><b>05 杂志封面登录</b><span>封面式品牌入口</span></button><button class="item" data-file="06-blueprint-canvas.html"><b>06 蓝图画布登录</b><span>空间/工程属性更强</span></button><button class="item" data-file="07-material-board-tile.html"><b>07 材料样板板</b><span>材料库业务气质</span></button><button class="item" data-file="08-dashboard-dock.html"><b>08 仪表盘浮动登录坞</b><span>后台系统感，登录悬浮</span></button><button class="item" data-file="09-vertical-rail.html"><b>09 竖向品牌轨道</b><span>品牌轨道 + 中央入口</span></button><button class="item" data-file="10-layered-cards.html"><b>10 Z 轴层叠项目卡</b><span>设计资料桌面层叠感</span></button></aside><section class="stage"><div class="top"><span id="title">01 全景海报浮岛</span><a id="open" href="01-full-bleed-island.html" target="_blank">新窗口打开</a></div><iframe class="frame" src="01-full-bleed-island.html"></iframe></section></main><script>
