<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>07 材料样板板</title><link rel="stylesheet" href="shared.css"><style>
.page{background:#d8d0c3;padding:34px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(8,1fr);gap:14px}
.tile{border-radius:26px;overflow:hidden;background:#f7f2ea;box-shadow:0 18px 48px rgba(58,45,32,.12);position:relative;padding:22px}.tile.photo{padding:0}
.t1{grid-column:1/5;grid-row:1/4;background-image:url("https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=900&q=85")}.t2{grid-column:5/8;grid-row:1/3;background:#1c1915;color:#fff}.t3{grid-column:8/13;grid-row:1/5;background-image:url("https://images.unsplash.com/photo-1600566752355-35792bedcfea?auto=format&fit=crop&w=1000&q=85")}.t4{grid-column:1/4;grid-row:4/9;background:#8e9a83}.t5{grid-column:4/8;grid-row:3/6;background-image:url("https://images.unsplash.com/photo-1617103996702-96ff29b1c467?auto=format&fit=crop&w=900&q=85")}.login-tile{grid-column:8/13;grid-row:5/9}.t6{grid-column:4/8;grid-row:6/9;background:#eee7da}
.tile h2{font-family:Georgia,serif;font-size:44px;line-height:1;margin:0}
@media(max-width:900px){body{overflow:auto}.page{display:block;padding:16px}.tile{min-height:160px;margin-bottom:14px}.login-tile{min-height:auto}}
</style></head><body><main class="page noise"><div class="tile photo t1"></div><div class="tile t2"><div class="brand"><b class="mark">急</b>着急信息</div></div><div class="tile photo t3"></div><div class="tile t4"></div><div class="tile photo t5"></div><div class="tile t6"><h2>Material Board</h2><p>把主材、辅材、定额做成可感知的业务入口。</p></div><section class="login-card login-tile reveal"><div class="eyebrow">Material Entry</div><h1>欢迎回来</h1><p>登录您的装修管家管理平台</p><form class="form"><div class="input-wrap"><input placeholder="手机号 / 账号"></div><div class="input-wrap"><input type="password" placeholder="密码"></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>登录</span><span>→</span></button></form></section></main></body></html>
