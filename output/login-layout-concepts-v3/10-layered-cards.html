<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 Z 轴层叠项目卡</title><link rel="stylesheet" href="shared.css"><style>
.page{background:radial-gradient(circle at 25% 20%,#fff 0,#efe7dc 38%,#cfc2b0 100%);display:grid;place-items:center}
.stack{position:absolute;inset:0}.cardx{position:absolute;border-radius:30px;overflow:hidden;box-shadow:0 30px 80px rgba(57,43,28,.18);border:1px solid rgba(255,255,255,.55);background:#fff;transition:transform .8s var(--ease)}
.c1{left:8vw;top:13vh;width:330px;height:430px;background-image:url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=900&q=85");background-size:cover;transform:rotate(-7deg) translate(calc(var(--mx)*-10px),calc(var(--my)*-8px))}
.c2{right:9vw;top:10vh;width:380px;height:260px;background:#171411;color:#fff;padding:28px;transform:rotate(5deg) translate(calc(var(--mx)*11px),calc(var(--my)*6px))}
.c3{right:14vw;bottom:10vh;width:300px;height:330px;background-image:url("https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=900&q=85");background-size:cover;transform:rotate(8deg) translate(calc(var(--mx)*-8px),calc(var(--my)*10px))}
.c4{left:20vw;bottom:9vh;width:310px;height:190px;padding:24px;transform:rotate(3deg)}
.login-card{width:420px;z-index:2;position:relative}
@media(max-width:760px){body{overflow:auto}.page{padding:20px;display:block}.stack{position:relative;height:280px}.cardx{transform:none!important}.c1{left:0;top:20px;width:170px;height:220px}.c2{right:0;top:0;width:190px;height:150px}.c3,.c4{display:none}.login-card{width:100%;margin-top:12px}}
</style></head><body><main class="page noise"><div class="stack"><div class="cardx c1 photo"></div><div class="cardx c2"><div class="brand"><b class="mark">急</b>着急信息</div><h2 style="font-family:Georgia,serif;font-size:42px;line-height:1;margin:38px 0 0">Quotation System</h2></div><div class="cardx c3 photo"></div><div class="cardx c4"><b>项目进度</b><p>客户、空间、报价、成本在同一张工作桌上。</p></div></div><section class="login-card reveal"><div class="eyebrow">Layered Workspace</div><h1>欢迎回来</h1><p>层叠卡片像设计资料摊在桌面上，适合装修业务。</p><form class="form"><div class="input-wrap"><input placeholder="手机号 / 账号"></div><div class="input-wrap"><input type="password" placeholder="密码"></div><div class="row"><span class="check"><i></i>记住密码</span><a class="link">忘记密码?</a></div><button class="submit" type="button"><span>登录</span><span>→</span></button></form></section></main><script src="shared.js"></script></body></html>
