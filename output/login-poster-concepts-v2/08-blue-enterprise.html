<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>08 Blue Enterprise</title><link rel="stylesheet" href="luxury-login.css"><style>:root{--bg:#07162c;--paper:#f6f9ff;--ink:#0d1d34;--muted:#69778a;--accent:#2f6feb;--veil:rgba(5,18,39,.58);--image:url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1900&q=90")}.brand-mark,.submit{background:#2f6feb}.floating-card{background:rgba(47,111,235,.24)}</style></head><body><main class="login-art-page"><section class="poster-shell"><div class="poster"><div class="brand"><span class="brand-mark">急</span>着急信息</div><div class="floating-card">审批待办<b>14条</b></div><div class="poster-copy"><span class="eyebrow">ENTERPRISE CONTROL</span><h1>从单店到集团，都需要一个稳定的数字入口。</h1><p>蓝色企业感更强，适合正式 SaaS 产品、对外销售、集团化管理场景。</p></div><div class="poster-meta"><span>分公司设置</span><span>角色权限</span><span>审批流程</span></div></div></section><section class="login-shell"><form class="login-panel"><div class="login-box"><h2>登录系统</h2><p>进入装企云管理平台</p><div class="field"><label>手机号 / 账号</label><div class="input-shell"><input value="13800000001"></div></div><div class="field"><label>密码</label><div class="input-shell"><input type="password" value="123456789"></div></div><div class="options"><label><input type="checkbox" checked>记住密码</label><span>忘记密码?</span></div><button class="submit">登录 <i>→</i></button><div class="login-foot">保留你原系统的蓝色品牌基因，但整体更高级。</div></div></form></section></main><script src="luxury-login.js"></script></body></html>
