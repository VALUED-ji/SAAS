<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 Paper Plan</title><link rel="stylesheet" href="luxury-login.css"><style>:root{--bg:#e8e1d6;--paper:#fffaf2;--ink:#272019;--muted:#7d736a;--accent:#8b6a45;--veil:rgba(74,54,36,.12);--image:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.24)),repeating-linear-gradient(90deg,rgba(87,67,45,.16) 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,rgba(87,67,45,.16) 0 1px,transparent 1px 46px)}.poster{color:#2a2119}.poster:after{background:linear-gradient(0deg,rgba(255,255,255,.25),transparent)}.poster::before{border-color:rgba(42,33,25,.18)}.eyebrow,.poster-meta span,.floating-card{background:rgba(255,255,255,.58);color:#574638;backdrop-filter:none}.poster p{color:#6b6259;text-shadow:none}.poster h1{text-shadow:none}.brand{color:#2a2119}.brand-mark{background:#2a2119;color:#fff}</style></head><body><main class="login-art-page"><section class="poster-shell"><div class="poster"><div class="brand"><span class="brand-mark">急</span>着急信息</div><div class="floating-card">工程量复核<b>8单</b></div><div class="poster-copy"><span class="eyebrow">DRAWING & BUDGET</span><h1>把复杂报价，整理成用户看得懂的工程语言。</h1><p>图纸、空间、定额、主材、综合费用都沿着同一条逻辑进入预算。</p></div><div class="poster-meta"><span>空间/类别</span><span>基装定额</span><span>预算模版</span></div></div></section><section class="login-shell"><form class="login-panel"><div class="login-box"><h2>欢迎回来</h2><p>登录预算报价管理平台</p><div class="field"><label>手机号 / 账号</label><div class="input-shell"><input value="13800000001"></div></div><div class="field"><label>密码</label><div class="input-shell"><input type="password" value="123456789"></div></div><div class="options"><label><input type="checkbox" checked>记住密码</label><span>忘记密码?</span></div><button class="submit">登录 <i>→</i></button><div class="login-foot">纸张、图纸、报价单气质，最贴近预算模块。</div></div></form></section></main><script src="luxury-login.js"></script></body></html>
