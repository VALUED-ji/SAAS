<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>06 Site Discipline</title><link rel="stylesheet" href="luxury-login.css"><style>:root{--bg:#1a1c1f;--paper:#f3f5f6;--ink:#151a20;--muted:#687280;--accent:#e2a94f;--veil:rgba(15,18,22,.5);--image:url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1900&q=90")}.poster-copy{width:min(720px,72%)}.brand-mark{background:#e2a94f;color:#111}.submit{background:#1d252d}</style></head><body><main class="login-art-page"><section class="poster-shell"><div class="poster"><div class="brand"><span class="brand-mark">急</span>着急信息</div><div class="floating-card">在施工地<b>26个</b></div><div class="poster-copy"><span class="eyebrow">SITE DISCIPLINE</span><h1>工地现场越复杂，系统入口越要干净。</h1><p>施工日志、节点验收、材料订单、工程量复核全部回到可执行的工作流。</p></div><div class="poster-meta"><span>施工日志</span><span>节点验收</span><span>工地归档</span></div></div></section><section class="login-shell"><form class="login-panel"><div class="login-box"><h2>登录工地系统</h2><p>进入装修项目交付平台</p><div class="field"><label>手机号 / 账号</label><div class="input-shell"><input value="13800000001"></div></div><div class="field"><label>密码</label><div class="input-shell"><input type="password" value="123456789"></div></div><div class="options"><label><input type="checkbox" checked>记住密码</label><span>忘记密码?</span></div><button class="submit">登录 <i>→</i></button><div class="login-foot">更适合强调施工交付、项目经理、工地管理的系统定位。</div></div></form></section></main><script src="luxury-login.js"></script></body></html>
