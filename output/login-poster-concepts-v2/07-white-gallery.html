<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>07 White Gallery</title><link rel="stylesheet" href="luxury-login.css"><style>:root{--bg:#e7ebef;--paper:#ffffff;--ink:#101820;--muted:#717b89;--accent:#2f6feb;--veil:rgba(255,255,255,.42);--image:url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1900&q=90")}.poster{color:#101820}.poster:after{background:linear-gradient(90deg,rgba(255,255,255,.82),rgba(255,255,255,.18)),linear-gradient(0deg,rgba(255,255,255,.68),transparent 64%)}.poster::before{border-color:rgba(16,24,32,.16)}.brand{color:#101820}.brand-mark,.submit{background:#101820;color:#fff}.poster h1{text-shadow:none}.poster p{color:#53606f}.eyebrow,.poster-meta span,.floating-card{background:rgba(255,255,255,.66);color:#344054}</style></head><body><main class="login-art-page"><section class="poster-shell"><div class="poster"><div class="brand"><span class="brand-mark">急</span>着急信息</div><div class="floating-card">门店在线<b>8家</b></div><div class="poster-copy"><span class="eyebrow">WHITE GALLERY SYSTEM</span><h1>高级，不一定要深色。干净本身就是质感。</h1><p>白色展厅感，适合希望系统清爽、明亮、耐看的装企。</p></div><div class="poster-meta"><span>客户管理</span><span>组织权限</span><span>系统设置</span></div></div></section><section class="login-shell"><form class="login-panel"><div class="login-box"><h2>欢迎回来</h2><p>登录您的装修管家管理平台</p><div class="field"><label>手机号 / 账号</label><div class="input-shell"><input value="13800000001"></div></div><div class="field"><label>密码</label><div class="input-shell"><input type="password" value="123456789"></div></div><div class="options"><label><input type="checkbox" checked>记住密码</label><span>忘记密码?</span></div><button class="submit">登录 <i>→</i></button><div class="login-foot">明亮但不廉价，适合通用正式登录页。</div></div></form></section></main><script src="luxury-login.js"></script></body></html>
